<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>LabyX — Connexion</title>
  <style>
    /* ── Général ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0d0f13;
      color: #e8e8e8;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* ── Boîte centrale ── */
    .boite {
      background-color: #151820;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 36px;
      width: 380px;
    }

    /* ── Titre ── */
    h1 {
      text-align: center;
      font-size: 22px;
      letter-spacing: 3px;
      margin-bottom: 24px;
      color: #e8e8e8;
    }
    h1 span { color: #f0c040; }

    /* ── Onglets ── */
    .onglets {
      display: flex;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 22px;
    }
    .onglet {
      flex: 1;
      padding: 9px;
      background: none;
      border: none;
      color: #7a7f8e;
      font-size: 13px;
      cursor: pointer;
    }
    .onglet.actif {
      background-color: #f0c040;
      color: #0d0f13;
      font-weight: bold;
    }

    /* ── Formulaire ── */
    .formulaire { display: none; }
    .formulaire.actif { display: block; }

    label {
      display: block;
      font-size: 12px;
      color: #7a7f8e;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin: 14px 0 5px;
    }

    input {
      width: 100%;
      background-color: #1c2030;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 7px;
      padding: 10px 12px;
      color: #e8e8e8;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #f0c040; }

    /* ── Message d'erreur ── */
    .erreur {
      color: #ff5f6d;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }
    .erreur.visible { display: block; }

    /* ── Bouton principal ── */
    .btn {
      width: 100%;
      margin-top: 20px;
      padding: 11px;
      background-color: #f0c040;
      color: #0d0f13;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
    }
    .btn:hover { opacity: 0.85; }

    /* ── Lien bas de formulaire ── */
    .lien {
      text-align: center;
      margin-top: 14px;
      font-size: 13px;
      color: #7a7f8e;
    }
    .lien span {
      color: #f0c040;
      cursor: pointer;
    }

    /* ── Encart comptes de test ── */
    .test-comptes {
      margin-top: 16px;
      background: rgba(59,232,176,0.08);
      border: 1px solid rgba(59,232,176,0.25);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12px;
      color: #3be8b0;
      line-height: 1.9;
    }
  </style>
</head>
<body>

<div class="boite">
  <h1>🌀 LABY<span>X</span></h1>

  <!-- Onglets -->
  <div class="onglets">
    <button class="onglet actif" onclick="changerOnglet('connexion', this)">Connexion</button>
    <button class="onglet"      onclick="changerOnglet('inscription', this)">Inscription</button>
  </div>

  <!-- Formulaire Connexion -->
  <div class="formulaire actif" id="form-connexion">
    <label>Email</label>
    <input type="email" id="c-email" placeholder="vous@exemple.com" />
    <label>Mot de passe</label>
    <input type="password" id="c-mdp" placeholder="••••••••" />
    <p class="erreur" id="err-connexion"></p>
    <button class="btn" onclick="seConnecter()">→ SE CONNECTER</button>
    <div class="lien">
      Pas de compte ? <span onclick="changerOnglet('inscription', document.querySelectorAll('.onglet')[1])">S'inscrire</span>
    </div>
  </div>

  <!-- Formulaire Inscription -->
  <div class="formulaire" id="form-inscription">
    <label>Nom d'utilisateur</label>
    <input type="text"     id="i-nom"   placeholder="joueur_123" />
    <label>Email</label>
    <input type="email"    id="i-email" placeholder="vous@exemple.com" />
    <label>Mot de passe</label>
    <input type="password" id="i-mdp"   placeholder="••••••••" />
    <label>Confirmer le mot de passe</label>
    <input type="password" id="i-mdp2"  placeholder="••••••••" />
    <p class="erreur" id="err-inscription"></p>
    <button class="btn" onclick="sInscrire()">→ CRÉER MON COMPTE</button>
    <div class="lien">
      Déjà un compte ? <span onclick="changerOnglet('connexion', document.querySelectorAll('.onglet')[0])">Se connecter</span>
    </div>
  </div>

  <!-- Comptes de test -->
  <div class="test-comptes">
    🧪 <strong>Comptes de test :</strong><br/>
    mariam@labyx.fr / <strong>1234</strong> — admin<br/>
    younes@labyx.fr / <strong>1234</strong> — user
  </div>
</div>

<script>
  // ── Comptes de test (navigateur sans Electron) ──
  var comptes = [
    { id: 1, username: 'Mariam', email: 'mariam@labyx.fr', password: '1234', role: 'admin' },
    { id: 2, username: 'Younes', email: 'younes@labyx.fr', password: '1234', role: 'user'  },
  ];

  // ── Changer d'onglet ──
  function changerOnglet(nom, bouton) {
    // Cacher tous les formulaires
    document.querySelectorAll('.formulaire').forEach(function(f) {
      f.classList.remove('actif');
    });
    // Désactiver tous les onglets
    document.querySelectorAll('.onglet').forEach(function(o) {
      o.classList.remove('actif');
    });
    // Afficher le bon formulaire
    document.getElementById('form-' + nom).classList.add('actif');
    bouton.classList.add('actif');
  }

  // ── Afficher une erreur ──
  function afficherErreur(id, message) {
    var el = document.getElementById(id);
    el.textContent = message;
    el.classList.add('visible');
  }

  function cacherErreur(id) {
    document.getElementById(id).classList.remove('visible');
  }

  // ── Connexion ──
  async function seConnecter() {
    var email    = document.getElementById('c-email').value.trim();
    var password = document.getElementById('c-mdp').value;
    cacherErreur('err-connexion');

    if (!email || !password) {
      afficherErreur('err-connexion', 'Remplis tous les champs !');
      return;
    }

    if (window.api) {
      // Mode Electron — vraie base de données
      var result = await window.api.login({ email, password });
      if (result.error) {
        afficherErreur('err-connexion', result.error);
      } else {
        localStorage.setItem('user', JSON.stringify(result.user));
        window.location.href = 'app.html';
      }
    } else {
      // Mode navigateur — comptes de test
      var compte = comptes.find(function(c) {
        return c.email === email && c.password === password;
      });
      if (!compte) {
        afficherErreur('err-connexion', 'Email ou mot de passe incorrect !');
        return;
      }
      localStorage.setItem('user', JSON.stringify(compte));
      window.location.href = 'app.html';
    }
  }

  // ── Inscription ──
  async function sInscrire() {
    var nom      = document.getElementById('i-nom').value.trim();
    var email    = document.getElementById('i-email').value.trim();
    var password = document.getElementById('i-mdp').value;
    var password2 = document.getElementById('i-mdp2').value;
    cacherErreur('err-inscription');

    if (!nom || !email || !password) {
      afficherErreur('err-inscription', 'Remplis tous les champs !');
      return;
    }
    if (password !== password2) {
      afficherErreur('err-inscription', 'Les mots de passe ne correspondent pas !');
      return;
    }

    if (window.api) {
      var result = await window.api.register({ username: nom, email, password });
      if (result.error) {
        afficherErreur('err-inscription', result.error);
      } else {
        alert('Compte créé ! Tu peux te connecter.');
        changerOnglet('connexion', document.querySelectorAll('.onglet')[0]);
      }
    } else {
      // Mode navigateur — vérifier que l'email n'existe pas déjà
      var existe = comptes.find(function(c) { return c.email === email; });
      if (existe) {
        afficherErreur('err-inscription', 'Cet email est déjà utilisé !');
        return;
      }
      comptes.push({ id: comptes.length + 1, username: nom, email, password, role: 'user' });
      alert('Compte créé ! Connecte-toi avec : ' + email + ' / ' + password);
      changerOnglet('connexion', document.querySelectorAll('.onglet')[0]);
    }
  }
</script>

</body>
</html>
