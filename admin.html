<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>LabyX — Admin</title>
  <style>
    /* ── Général ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0d0f13;
      color: #e8e8e8;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 210px;
      background-color: #151820;
      border-right: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      padding: 20px 0;
    }

    .sidebar-logo {
      padding: 0 18px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 10px;
    }
    .badge-admin {
      display: inline-block;
      padding: 2px 7px;
      background: rgba(255,95,109,0.15);
      color: #ff5f6d;
      border: 1px solid rgba(255,95,109,0.3);
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .sidebar-titre { font-size: 16px; font-weight: bold; letter-spacing: 2px; }
    .sidebar-titre span { color: #f0c040; }

    .nav-btn {
      display: block;
      width: 100%;
      padding: 11px 18px;
      background: none;
      border: none;
      color: #7a7f8e;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
    }
    .nav-btn:hover { color: #e8e8e8; background: rgba(255,255,255,0.04); }
    .nav-btn.actif {
      color: #ff5f6d;
      background: rgba(255,95,109,0.08);
      border-left: 2px solid #ff5f6d;
      padding-left: 16px;
    }

    /* ── Main ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .topbar {
      height: 52px;
      background-color: #151820;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 10px;
      flex-shrink: 0;
    }
    .topbar-titre { flex: 1; font-size: 12px; font-weight: bold; letter-spacing: 1.5px; }
    .point-vert {
      width: 7px; height: 7px; border-radius: 50%;
      background-color: #3be8b0;
      box-shadow: 0 0 6px #3be8b0;
    }

    .contenu { flex: 1; overflow-y: auto; padding: 26px; }

    /* ── Pages ── */
    .page { display: none; }
    .page.actif { display: block; }

    .page-titre {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .page-titre span { color: #f0c040; }

    /* ── KPI ── */
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 26px;
    }
    .kpi {
      background-color: #151820;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 16px;
      border-top: 2px solid;
    }
    .kpi.or   { border-top-color: #f0c040; }
    .kpi.vert { border-top-color: #3be8b0; }
    .kpi.rouge{ border-top-color: #ff5f6d; }
    .kpi.warn { border-top-color: #f07840; }

    .kpi p    { font-size: 11px; color: #7a7f8e; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
    .kpi span { font-size: 26px; font-weight: bold; }
    .kpi.or   span { color: #f0c040; }
    .kpi.vert span { color: #3be8b0; }
    .kpi.rouge span { color: #ff5f6d; }
    .kpi.warn span { color: #f07840; }

    /* ── Tableau ── */
    .tableau-boite {
      background-color: #151820;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .tableau-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .tableau-header strong { font-size: 13px; }

    input.recherche {
      background-color: #1c2030;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 7px 12px;
      color: #e8e8e8;
      font-size: 13px;
      outline: none;
      width: 220px;
    }
    input.recherche:focus { border-color: rgba(240,192,64,0.4); }

    table { width: 100%; border-collapse: collapse; }
    th {
      background-color: #1c2030;
      padding: 9px 16px;
      text-align: left;
      font-size: 11px;
      color: #7a7f8e;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    td {
      padding: 10px 16px;
      font-size: 13px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    tr:hover td { background: rgba(255,255,255,0.02); }

    /* ── Badges ── */
    .badge {
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: bold;
    }
    .b-admin  { background: rgba(255,95,109,0.15);  color: #ff5f6d; }
    .b-user   { background: rgba(59,232,176,0.12);  color: #3be8b0; }
    .b-banned { background: rgba(240,120,64,0.12);  color: #f07840; }

    /* ── Bouton supprimer ── */
    .btn-sup {
      background: none;
      border: 1px solid rgba(255,95,109,0.4);
      color: #ff5f6d;
      padding: 4px 9px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
    }
    .btn-sup:hover { background: rgba(255,95,109,0.15); }
  </style>
</head>
<body>

<!-- ── SIDEBAR ── -->
<div class="sidebar">
  <div class="sidebar-logo">
    <div class="badge-admin">ADMIN</div>
    <div class="sidebar-titre">LABY<span>X</span></div>
  </div>
  <button class="nav-btn actif" onclick="allerA('stats', this)">📊 Statistiques</button>
  <button class="nav-btn"       onclick="allerA('users', this)">👥 Utilisateurs</button>
  <button class="nav-btn"       onclick="allerA('labs',  this)">🌀 Labyrinthes</button>
</div>

<!-- ── MAIN ── -->
<div class="main">
  <div class="topbar">
    <span class="topbar-titre" id="topbar-titre">STATISTIQUES</span>
    <div class="point-vert"></div>
    <span style="font-size:12px;color:#7a7f8e" id="horloge"></span>
  </div>

  <div class="contenu">

    <!-- Page Statistiques -->
    <div class="page actif" id="page-stats">
      <div class="page-titre">Vue d'<span>ensemble</span></div>
      <div class="kpis">
        <div class="kpi or">   <p>Utilisateurs</p><span id="kpi-u">—</span></div>
        <div class="kpi vert"> <p>Labyrinthes</p> <span id="kpi-l">—</span></div>
        <div class="kpi rouge"><p>Bannis</p>       <span id="kpi-b">—</span></div>
        <div class="kpi warn"> <p>Admins</p>       <span id="kpi-a">—</span></div>
      </div>
    </div>

    <!-- Page Utilisateurs -->
    <div class="page" id="page-users">
      <div class="page-titre">Tous les <span>Utilisateurs</span></div>
      <div class="tableau-boite">
        <div class="tableau-header">
          <strong id="nb-users">Utilisateurs</strong>
          <input class="recherche" type="text" placeholder="🔍 Rechercher..." oninput="chercherUser(this.value)" />
        </div>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Nom</th>
              <th>Email</th>
              <th>Rôle</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="corps-users"></tbody>
        </table>
      </div>
    </div>

    <!-- Page Labyrinthes -->
    <div class="page" id="page-labs">
      <div class="page-titre">Tous les <span>Labyrinthes</span></div>
      <div class="tableau-boite">
        <div class="tableau-header">
          <strong id="nb-labs">Labyrinthes</strong>
          <input class="recherche" type="text" placeholder="🔍 Rechercher..." oninput="chercherLab(this.value)" />
        </div>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Nom</th>
              <th>Taille</th>
              <th>Créé par</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="corps-labs"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script>
  // ── Données fictives ──────────────────────────────────
  var USERS = [
    { id:1,  username:'Mariam',    email:'mariam@labyx.fr',   role:'admin'  },
    { id:2,  username:'Younes',    email:'younes@labyx.fr',   role:'user'   },
    { id:3,  username:'Sofia',     email:'sofia@labyx.fr',    role:'user'   },
    { id:4,  username:'Karim',     email:'karim@labyx.fr',    role:'user'   },
    { id:5,  username:'Nassim',    email:'nassim@labyx.fr',   role:'user'   },
    { id:6,  username:'Lina',      email:'lina@labyx.fr',     role:'user'   },
    { id:7,  username:'Rayan',     email:'rayan@labyx.fr',    role:'user'   },
    { id:8,  username:'Ines',      email:'ines@labyx.fr',     role:'user'   },
    { id:9,  username:'Mehdi',     email:'mehdi@labyx.fr',    role:'user'   },
    { id:10, username:'Sara',      email:'sara@labyx.fr',     role:'user'   },
    { id:11, username:'Amine',     email:'amine@labyx.fr',    role:'user'   },
    { id:12, username:'Nour',      email:'nour@labyx.fr',     role:'user'   },
    { id:13, username:'Adam',      email:'adam@labyx.fr',     role:'user'   },
    { id:14, username:'Leila',     email:'leila@labyx.fr',    role:'user'   },
    { id:15, username:'Hamza',     email:'hamza@labyx.fr',    role:'user'   },
    { id:16, username:'SpamBot99', email:'spam@bot.net',      role:'banned' },
    { id:17, username:'FakeUser',  email:'fake@nowhere.com',  role:'banned' },
    { id:18, username:'HackTool',  email:'hack@tool.ru',      role:'banned' },
  ];

  var LABS = [
    { id:1,  name:'Labyrinthe Débutant',   cols:10, rows:10, user_id:1  },
    { id:2,  name:'Carrefour des Ombres',  cols:15, rows:15, user_id:2  },
    { id:3,  name:'Forêt Maudite',         cols:20, rows:20, user_id:3  },
    { id:4,  name:'Tour Infinie',           cols:15, rows:15, user_id:1  },
    { id:5,  name:'Mini Dédale',            cols: 8, rows: 8, user_id:4  },
    { id:6,  name:'Crypte Profonde',        cols:25, rows:25, user_id:5  },
    { id:7,  name:'Jardin Labyrinthique',   cols:12, rows:12, user_id:6  },
    { id:8,  name:'Couloirs Perdus',        cols:18, rows:18, user_id:7  },
    { id:9,  name:'Spirale du Chaos',       cols:20, rows:20, user_id:8  },
    { id:10, name:'Labyrinthe de Glace',    cols:15, rows:15, user_id:9  },
    { id:11, name:'Donjon Maudit',          cols:22, rows:22, user_id:10 },
    { id:12, name:'Passage Secret',         cols:10, rows:10, user_id:11 },
    { id:13, name:'Le Grand Méandre',       cols:30, rows:30, user_id:1  },
    { id:14, name:'Ruines Antiques',        cols:18, rows:18, user_id:12 },
    { id:15, name:'Dédale du Minotaure',    cols:25, rows:25, user_id:13 },
    { id:16, name:'Labyrinthe Express',     cols: 8, rows: 8, user_id:14 },
    { id:17, name:'Tunnel sans Fin',        cols:20, rows:20, user_id:15 },
    { id:18, name:'Niveau Final',           cols:35, rows:35, user_id:1  },
  ];
  // ─────────────────────────────────────────────────────

  // ── Charger depuis l'API ou les données fictives ──
  async function obtenirUsers() {
    if (window.api) return await window.api.getAllUsers();
    return USERS;
  }

  async function obtenirLabs() {
    if (window.api) return await window.api.getLabyrinths();
    return LABS;
  }

  var tousUsers = [];
  var tousLabs  = [];

  // ── Charger toutes les données ──
  async function charger() {
    tousUsers = await obtenirUsers();
    tousLabs  = await obtenirLabs();

    // Mettre à jour les KPIs
    document.getElementById('kpi-u').textContent = tousUsers.length;
    document.getElementById('kpi-l').textContent = tousLabs.length;
    document.getElementById('kpi-b').textContent = tousUsers.filter(function(u) { return u.role === 'banned'; }).length;
    document.getElementById('kpi-a').textContent = tousUsers.filter(function(u) { return u.role === 'admin'; }).length;

    afficherUsers(tousUsers);
    afficherLabs(tousLabs);
  }

  // ── Afficher le tableau des utilisateurs ──
  function afficherUsers(liste) {
    document.getElementById('nb-users').textContent = 'Utilisateurs (' + liste.length + ')';
    var corps = document.getElementById('corps-users');
    corps.innerHTML = '';

    for (var i = 0; i < liste.length; i++) {
      var u = liste[i];
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td style="color:#7a7f8e">#' + u.id + '</td>'
        + '<td><strong>' + u.username + '</strong></td>'
        + '<td style="color:#7a7f8e">' + u.email + '</td>'
        + '<td><span class="badge b-' + u.role + '">' + u.role + '</span></td>'
        + '<td><button class="btn-sup" onclick="supprimerUser(' + u.id + ')">Supprimer</button></td>';
      corps.appendChild(tr);
    }
  }

  // ── Afficher le tableau des labyrinthes ──
  function afficherLabs(liste) {
    document.getElementById('nb-labs').textContent = 'Labyrinthes (' + liste.length + ')';
    var corps = document.getElementById('corps-labs');
    corps.innerHTML = '';

    for (var i = 0; i < liste.length; i++) {
      var l = liste[i];
      var createur = tousUsers.find(function(u) { return u.id === l.user_id; });
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td style="color:#7a7f8e">#' + l.id + '</td>'
        + '<td><strong>' + l.name + '</strong></td>'
        + '<td style="color:#7a7f8e;font-size:12px">' + l.cols + '×' + l.rows + '</td>'
        + '<td style="color:#7a7f8e">' + (createur ? createur.username : '?') + '</td>'
        + '<td><button class="btn-sup" onclick="supprimerLab(' + l.id + ')">Supprimer</button></td>';
      corps.appendChild(tr);
    }
  }

  // ── Recherche ──
  function chercherUser(q) {
    var filtre = tousUsers.filter(function(u) {
      return u.username.toLowerCase().includes(q.toLowerCase())
          || u.email.toLowerCase().includes(q.toLowerCase());
    });
    afficherUsers(filtre);
  }

  function chercherLab(q) {
    var filtre = tousLabs.filter(function(l) {
      return l.name.toLowerCase().includes(q.toLowerCase());
    });
    afficherLabs(filtre);
  }

  // ── Supprimer ──
  async function supprimerUser(id) {
    if (!confirm('Supprimer cet utilisateur ?')) return;
    if (window.api) {
      await window.api.deleteUser(id);
    } else {
      var idx = tousUsers.findIndex(function(u) { return u.id === id; });
      if (idx !== -1) tousUsers.splice(idx, 1);
    }
    afficherUsers(tousUsers);
    document.getElementById('kpi-u').textContent = tousUsers.length;
  }

  async function supprimerLab(id) {
    if (!confirm('Supprimer ce labyrinthe ?')) return;
    if (window.api) {
      await window.api.deleteLabyrinth(id);
    } else {
      var idx = tousLabs.findIndex(function(l) { return l.id === id; });
      if (idx !== -1) tousLabs.splice(idx, 1);
    }
    afficherLabs(tousLabs);
    document.getElementById('kpi-l').textContent = tousLabs.length;
  }

  // ── Navigation ──
  function allerA(pageId, bouton) {
    document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('actif'); });
    document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('actif'); });
    document.getElementById('page-' + pageId).classList.add('actif');
    if (bouton) bouton.classList.add('actif');
    var titres = { stats: 'STATISTIQUES', users: 'UTILISATEURS', labs: 'LABYRINTHES' };
    document.getElementById('topbar-titre').textContent = titres[pageId];
  }

  // ── Horloge ──
  function mettreAJourHorloge() {
    document.getElementById('horloge').textContent =
      new Date().toLocaleTimeString('fr-FR');
  }
  setInterval(mettreAJourHorloge, 1000);
  mettreAJourHorloge();

  // ── Démarrage ──
  charger();
</script>

</body>
</html>
