<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/><title>LabyX — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0f13;--sur:#151820;--sur2:#1c2030;--brd:rgba(255,255,255,.08);--acc:#f0c040;--grn:#3be8b0;--red:#ff5f6d;--warn:#f07840;--txt:#e8e8e8;--muted:#7a7f8e}
body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;display:flex;height:100vh;overflow:hidden}
.sidebar{width:210px;background:var(--sur);border-right:1px solid var(--brd);display:flex;flex-direction:column;flex-shrink:0;padding:20px 0}
.logo{padding:0 18px 20px;border-bottom:1px solid var(--brd);margin-bottom:10px}
.logo .badge{display:inline-block;padding:2px 7px;background:rgba(255,95,109,.15);color:var(--red);border:1px solid rgba(255,95,109,.3);border-radius:4px;font-size:10px;font-family:'Space Mono',monospace;letter-spacing:1px;margin-bottom:6px}
.logo .title{font-family:'Space Mono',monospace;font-size:15px;letter-spacing:2px}
.logo .title span{color:var(--acc)}
.ni{display:flex;align-items:center;gap:9px;padding:10px 18px;font-size:13px;color:var(--muted);background:none;border:none;width:100%;text-align:left;cursor:pointer;font-family:'DM Sans',sans-serif;transition:.2s}
.ni:hover{color:var(--txt);background:rgba(255,255,255,.04)}
.ni.on{color:var(--red);background:rgba(255,95,109,.08);border-left:2px solid var(--red);padding-left:16px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;border-bottom:1px solid var(--brd);display:flex;align-items:center;padding:0 24px;gap:10px;flex-shrink:0;background:var(--sur)}
.topbar-title{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1.5px;flex:1}
.dot{width:7px;height:7px;border-radius:50%;background:var(--grn);box-shadow:0 0 6px var(--grn);animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.content{flex:1;overflow-y:auto;padding:24px}
.page{display:none;animation:pi .2s ease}.page.on{display:block}
@keyframes pi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.ptitle{font-family:'Space Mono',monospace;font-size:16px;margin-bottom:20px}
.ptitle span{color:var(--acc)}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--sur);border:1px solid var(--brd);border-radius:10px;padding:16px;border-top:2px solid}
.kpi.a{border-top-color:var(--acc)}.kpi.g{border-top-color:var(--grn)}.kpi.r{border-top-color:var(--red)}.kpi.w{border-top-color:var(--warn)}
.kpi p{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.kpi strong{font-family:'Space Mono',monospace;font-size:26px}
.kpi.a strong{color:var(--acc)}.kpi.g strong{color:var(--grn)}.kpi.r strong{color:var(--red)}.kpi.w strong{color:var(--warn)}
/* Table */
.tcard{background:var(--sur);border:1px solid var(--brd);border-radius:10px;overflow:hidden;margin-bottom:20px}
.thead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--brd)}
.thead span{font-size:13px;font-weight:600}
input.search{background:var(--sur2);border:1px solid var(--brd);border-radius:6px;padding:7px 12px;color:var(--txt);font-size:13px;outline:none;width:220px;font-family:'DM Sans',sans-serif}
input.search:focus{border-color:rgba(240,192,64,.4)}
table{width:100%;border-collapse:collapse}
th{background:var(--sur2);padding:9px 16px;text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
td{padding:10px 16px;font-size:13px;border-top:1px solid var(--brd)}
tr:hover td{background:rgba(255,255,255,.02)}
.badge{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.b-admin{background:rgba(255,95,109,.15);color:var(--red)}.b-user{background:rgba(59,232,176,.12);color:var(--grn)}.b-banned{background:rgba(240,120,64,.12);color:var(--warn)}
.btn-del{background:none;border:1px solid rgba(255,95,109,.4);color:var(--red);padding:4px 9px;border-radius:5px;cursor:pointer;font-size:11px;transition:.2s}
.btn-del:hover{background:rgba(255,95,109,.15)}
</style>
</head>
<body>
<div class="sidebar">
  <div class="logo">
    <div class="badge">ADMIN</div>
    <div class="title">LABY<span>X</span></div>
  </div>
  <button class="ni on" onclick="go('stats',this)">📊 Statistiques</button>
  <button class="ni"    onclick="go('users',this)">👥 Utilisateurs</button>
  <button class="ni"    onclick="go('labs',this)">🌀 Labyrinthes</button>
</div>

<div class="main">
  <div class="topbar">
    <span class="topbar-title" id="ttitle">STATISTIQUES</span>
    <div class="dot"></div>
    <span style="font-size:12px;color:var(--muted)" id="clock"></span>
  </div>
  <div class="content">

    <div class="page on" id="page-stats">
      <div class="ptitle">Vue d'<span>ensemble</span></div>
      <div class="kpis">
        <div class="kpi a"><p>Utilisateurs</p><strong id="kU">—</strong></div>
        <div class="kpi g"><p>Labyrinthes</p><strong id="kL">—</strong></div>
        <div class="kpi r"><p>Bannis</p><strong id="kB">—</strong></div>
        <div class="kpi w"><p>Admins</p><strong id="kA">—</strong></div>
      </div>
    </div>

    <div class="page" id="page-users">
      <div class="ptitle">Tous les <span>Utilisateurs</span></div>
      <div class="tcard">
        <div class="thead"><span id="nbU">Utilisateurs</span><input class="search" type="text" placeholder="🔍 Rechercher..." oninput="filtreU(this.value)"/></div>
        <table><thead><tr><th>#</th><th>Nom</th><th>Email</th><th>Rôle</th><th>Action</th></tr></thead>
        <tbody id="tbU"></tbody></table>
      </div>
    </div>

    <div class="page" id="page-labs">
      <div class="ptitle">Tous les <span>Labyrinthes</span></div>
      <div class="tcard">
        <div class="thead"><span id="nbL">Labyrinthes</span><input class="search" type="text" placeholder="🔍 Rechercher..." oninput="filtreL(this.value)"/></div>
        <table><thead><tr><th>#</th><th>Nom</th><th>Taille</th><th>Créé par</th><th>Action</th></tr></thead>
        <tbody id="tbL"></tbody></table>
      </div>
    </div>

  </div>
</div>

<script>
const USERS=[
  {id:1,username:'Mariam',   email:'mariam@labyx.fr',  role:'admin' },
  {id:2,username:'Younes',   email:'younes@labyx.fr',  role:'user'  },
  {id:3,username:'Sofia',    email:'sofia@labyx.fr',   role:'user'  },
  {id:4,username:'Karim',    email:'karim@labyx.fr',   role:'user'  },
  {id:5,username:'Nassim',   email:'nassim@labyx.fr',  role:'user'  },
  {id:6,username:'Lina',     email:'lina@labyx.fr',    role:'user'  },
  {id:7,username:'Rayan',    email:'rayan@labyx.fr',   role:'user'  },
  {id:8,username:'Ines',     email:'ines@labyx.fr',    role:'user'  },
  {id:9,username:'Mehdi',    email:'mehdi@labyx.fr',   role:'user'  },
  {id:10,username:'Sara',    email:'sara@labyx.fr',    role:'user'  },
  {id:11,username:'Amine',   email:'amine@labyx.fr',   role:'user'  },
  {id:12,username:'Nour',    email:'nour@labyx.fr',    role:'user'  },
  {id:13,username:'Adam',    email:'adam@labyx.fr',    role:'user'  },
  {id:14,username:'Leila',   email:'leila@labyx.fr',   role:'user'  },
  {id:15,username:'Hamza',   email:'hamza@labyx.fr',   role:'user'  },
  {id:16,username:'SpamBot', email:'spam@bot.net',     role:'banned'},
  {id:17,username:'FakeUser',email:'fake@nowhere.com', role:'banned'},
  {id:18,username:'HackTool',email:'hack@tool.ru',     role:'banned'},
];
const LABS=[
  {id:1, name:'Labyrinthe Débutant', cols:10,rows:10,user_id:1},
  {id:2, name:'Carrefour des Ombres',cols:15,rows:15,user_id:2},
  {id:3, name:'Forêt Maudite',       cols:20,rows:20,user_id:3},
  {id:4, name:'Tour Infinie',         cols:15,rows:15,user_id:1},
  {id:5, name:'Mini Dédale',          cols: 8,rows: 8,user_id:4},
  {id:6, name:'Crypte Profonde',      cols:25,rows:25,user_id:5},
  {id:7, name:'Jardin Labyrinthique', cols:12,rows:12,user_id:6},
  {id:8, name:'Couloirs Perdus',      cols:18,rows:18,user_id:7},
  {id:9, name:'Spirale du Chaos',     cols:20,rows:20,user_id:8},
  {id:10,name:'Labyrinthe de Glace',  cols:15,rows:15,user_id:9},
  {id:11,name:'Donjon Maudit',        cols:22,rows:22,user_id:10},
  {id:12,name:'Passage Secret',       cols:10,rows:10,user_id:11},
  {id:13,name:'Le Grand Méandre',     cols:30,rows:30,user_id:1},
  {id:14,name:'Ruines Antiques',      cols:18,rows:18,user_id:12},
  {id:15,name:'Dédale du Minotaure',  cols:25,rows:25,user_id:13},
  {id:16,name:'Labyrinthe Express',   cols: 8,rows: 8,user_id:14},
  {id:17,name:'Tunnel sans Fin',      cols:20,rows:20,user_id:15},
  {id:18,name:'Niveau Final',         cols:35,rows:35,user_id:1},
];

async function getUsers(){return window.api?await window.api.getAllUsers():USERS;}
async function getLabs(){return window.api?await window.api.getLabyrinths():LABS;}

let us=[],ls=[];

async function charger(){
  us=await getUsers(); ls=await getLabs();
  document.getElementById('kU').textContent=us.length;
  document.getElementById('kL').textContent=ls.length;
  document.getElementById('kB').textContent=us.filter(u=>u.role==='banned').length;
  document.getElementById('kA').textContent=us.filter(u=>u.role==='admin').length;
  affU(us); affL(ls);
}

function affU(list){
  document.getElementById('nbU').textContent=`Utilisateurs (${list.length})`;
  document.getElementById('tbU').innerHTML=list.map(u=>`
    <tr>
      <td style="color:var(--muted)">#${u.id}</td>
      <td><strong>${u.username}</strong></td>
      <td style="color:var(--muted)">${u.email}</td>
      <td><span class="badge b-${u.role}">${u.role}</span></td>
      <td><button class="btn-del" onclick="supU(${u.id})">Supprimer</button></td>
    </tr>`).join('');
}

function affL(list){
  document.getElementById('nbL').textContent=`Labyrinthes (${list.length})`;
  document.getElementById('tbL').innerHTML=list.map(l=>{
    const cr=us.find(u=>u.id===l.user_id);
    return`<tr>
      <td style="color:var(--muted)">#${l.id}</td>
      <td><strong>${l.name}</strong></td>
      <td style="color:var(--muted);font-size:12px">${l.cols}×${l.rows}</td>
      <td style="color:var(--muted)">${cr?cr.username:'?'}</td>
      <td><button class="btn-del" onclick="supL(${l.id})">Supprimer</button></td>
    </tr>`;}).join('');
}

function filtreU(q){affU(us.filter(u=>u.username.toLowerCase().includes(q.toLowerCase())||u.email.toLowerCase().includes(q.toLowerCase())));}
function filtreL(q){affL(ls.filter(l=>l.name.toLowerCase().includes(q.toLowerCase())));}

async function supU(id){
  if(!confirm('Supprimer cet utilisateur ?'))return;
  if(window.api)await window.api.deleteUser(id);
  else{const i=us.findIndex(u=>u.id===id);if(i!==-1)us.splice(i,1);}
  affU(us);document.getElementById('kU').textContent=us.length;
}
async function supL(id){
  if(!confirm('Supprimer ce labyrinthe ?'))return;
  if(window.api)await window.api.deleteLabyrinth(id);
  else{const i=ls.findIndex(l=>l.id===id);if(i!==-1)ls.splice(i,1);}
  affL(ls);document.getElementById('kL').textContent=ls.length;
}

function go(id,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.ni').forEach(b=>b.classList.remove('on'));
  document.getElementById('page-'+id).classList.add('on');
  if(btn)btn.classList.add('on');
  const t={stats:'STATISTIQUES',users:'UTILISATEURS',labs:'LABYRINTHES'};
  document.getElementById('ttitle').textContent=t[id];
}

setInterval(()=>{
  document.getElementById('clock').textContent=new Date().toLocaleTimeString('fr-FR');
},1000);

charger();
</script>
</body>
</html>
